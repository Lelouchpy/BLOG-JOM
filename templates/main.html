{% extends "base.html" %}

{% block title %}Welcome | Jomari's Blog{% endblock %}

{% block content %}
<div class="main-container">
    <div class="profile-section">
        <div class="profile-image">
            <img src="{{ url_for('serve_image', filename='blog6.png') }}" alt="Jomari's Profile">
        </div>
        <h1 class="welcome-text">Welcome to Jomari's Blog</h1>
        <p class="tagline">Exploring Life, Technology, and Creative Pursuits</p>
    </div>

    <div class="nav-buttons">
        <a href="{{ url_for('home') }}" class="nav-button">
            <span class="button-icon">🏠</span>
            <span class="button-text">Home</span>
        </a>
        <a href="{{ url_for('about') }}" class="nav-button">
            <span class="button-icon">👤</span>
            <span class="button-text">About</span>
        </a>
        <a href="{{ url_for('blog') }}" class="nav-button">
            <span class="button-icon">📝</span>
            <span class="button-text">Blog</span>
        </a>
    </div>
</div>

<style>
    .main-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4rem 2rem;
        min-height: 80vh;
        background: linear-gradient(135deg, #f6f8fc 0%, #ffffff 100%);
    }

    .profile-section {
        text-align: center;
        margin-bottom: 3rem;
    }

    .profile-image {
        width: 250px;
        height: 250px;
        margin: 0 auto 2rem;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        border: 4px solid white;
        transition: transform 0.3s ease;
        background: white;
    }

    .profile-image:hover {
        transform: scale(1.05);
    }

    .profile-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .welcome-text {
        font-size: 2.5rem;
        color: #1a1a1a;
        margin-bottom: 0.5rem;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .tagline {
        color: #666;
        font-size: 1.1rem;
        margin-bottom: 2rem;
    }

    .nav-buttons {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    .nav-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.5rem 2.5rem;
        background: white;
        border-radius: 1rem;
        text-decoration: none;
        color: #333;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: all 0.3s ease;
        min-width: 150px;
        position: relative;
        overflow: hidden;
    }

    .nav-button:before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--primary-color);
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
    }

    .nav-button:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        color: white;
    }

    .nav-button:hover:before {
        opacity: 1;
    }

    .button-icon {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        position: relative;
        z-index: 2;
    }

    .button-text {
        font-size: 1.1rem;
        font-weight: 500;
        position: relative;
        z-index: 2;
    }

    @media (max-width: 768px) {
        .welcome-text {
            font-size: 2rem;
        }
        
        .nav-buttons {
            flex-direction: column;
            width: 100%;
            max-width: 300px;
        }
        
        .nav-button {
            width: 100%;
        }

        .profile-image {
            width: 200px;
            height: 200px;
        }
    }
</style>
{% endblock %}
