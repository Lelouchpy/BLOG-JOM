{% extends "base.html" %}

{% block title %}Blog | Jomari's Blog{% endblock %}

{% block content %}
<style>
    .blog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2rem;
        padding: 2rem 0;
    }

    .blog-card {
        background: white;
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.3s ease;
    }

    .blog-card:hover {
        transform: translateY(-5px);
    }

    .blog-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .blog-content {
        padding: 1.5rem;
    }

    .blog-title {
        margin: 0 0 0.5rem 0;
        font-size: 1.25rem;
        color: #1a1a1a;
    }

    .blog-date {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
    }

    .blog-excerpt {
        color: #4a4a4a;
        margin-bottom: 1rem;
    }

    .read-more {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 0.5rem;
        transition: opacity 0.3s;
    }

    .read-more:hover {
        opacity: 0.9;
    }

    .page-title {
        text-align: center;
        margin: 2rem 0;
        color: #1a1a1a;
    }
</style>

<h1 class="page-title">My Blog Posts</h1>

<div class="blog-grid">
    {% for post in posts %}
    <article class="blog-card">
        <img 
            src="{{ url_for('serve_image', filename=post.image) }}"  
            alt="{{ post.title }}"
            class="blog-image"
        >
        <div class="blog-content">
            <h2 class="blog-title">{{ post.title }}</h2>
            <div class="blog-date">{{ post.date.strftime('%B %d, %Y') }}</div>
            <p class="blog-excerpt">{{ post.content[:100] }}...</p>
            <a href="{{ url_for('post', post_id=post.id) }}" class="read-more">Read More</a>
        </div>
    </article>
    {% endfor %}
</div>
{% endblock %}
